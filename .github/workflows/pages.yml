# Build + deploy the tools/ static site to GitHub Pages.
#
# On every push to main:
#   1. Inject window.GSST_BUILD_API from the GSST_BUILD_API repo secret into
#      tile_picker.html so the hosted-build button hits the real Worker URL.
#      Without the secret the picker shows the "hosted build not configured"
#      message instead of POSTing into the void.
#   2. Upload the tools/ directory as the Pages artifact.
#
# Note: tools/manifest.json is generated in the BUILD repo (private) by
# tools/build_manifest.py, then mirrored to this public repo via
# tools/mirror_public.ps1. The Pages workflow does NOT regenerate it because
# the build scripts live in the private repo and aren't reachable here.
#
# Enable in repo Settings -> Pages -> Source = "GitHub Actions" before pushing
# this workflow. The first run is the deploy; subsequent ones are updates.

name: Deploy tools site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "routable/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:                     # manual trigger from Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false              # don't kill an in-flight deploy

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Inject the hosted build-API URL if configured. The picker reads
      # window.GSST_BUILD_API at runtime; if absent => "hosted build not
      # configured" message.
      - name: Inject build API URL
        env:
          GSST_BUILD_API: ${{ secrets.GSST_BUILD_API }}
        run: |
          if [ -n "$GSST_BUILD_API" ]; then
            echo "Injecting GSST_BUILD_API = $GSST_BUILD_API"
            python - <<'PY'
          import os, re, pathlib
          p = pathlib.Path("tools/tile_picker.html")
          url = os.environ["GSST_BUILD_API"].rstrip("/")
          html = p.read_text(encoding="utf-8")
          tag = f'<script>window.GSST_BUILD_API = "{url}";</script>'
          new = re.sub(r"(<body[^>]*>)", r"\1\n" + tag, html, count=1)
          p.write_text(new, encoding="utf-8")
          print("Injected", url, "into", p)
          PY
          else
            echo "No GSST_BUILD_API secret set -- picker will show offline-only path."
          fi

      # routable.html fetches the build script + mkgmap options to assemble
      # its build-kit zip; publish them next to the page.
      - name: Copy routable build kit sources
        run: cp -r routable tools/routable

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./tools

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
