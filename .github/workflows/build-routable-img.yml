# Build the routable vector Garmin map (.img) for fenix 9 Pro / Edge 1050.
#
# - Scheduled / manual run without inputs: all of Switzerland, published as
#   release `routable-latest` (assets CH_routable.img + CH_routable.zip).
#   tools/app.html#routable links to those assets.
# - Manual run with a bbox: custom area, uploaded as a workflow artifact only
#   (the release stays the full-country build).
#
# Pipeline lives in routable/build_img.sh (OSM extract -> osmium -> splitter
# -> mkgmap --route --index --gmapsupp).

name: Build routable IMG

on:
  schedule:
    - cron: "17 3 2 * *"                  # monthly, 2nd of the month 03:17 UTC
  workflow_dispatch:
    inputs:
      bbox:
        description: "W,S,E,N in WGS84 degrees (empty = all of Switzerland -> release)"
        required: false
        default: ""
      name:
        description: "Map name shown on the device"
        required: false
        default: "CH routable"
      family_id:
        description: "Garmin family ID (1-65535)"
        required: false
        default: "6421"
      out_name:
        description: "Output file name"
        required: false
        default: "CH_routable.img"

permissions:
  contents: write

concurrency:
  group: routable-img-${{ github.event.inputs.bbox || 'ch' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install osmium-tool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool

      - name: Build
        env:
          BBOX: ${{ github.event.inputs.bbox }}
          NAME: ${{ github.event.inputs.name || 'CH routable' }}
          FID: ${{ github.event.inputs.family_id || '6421' }}
          OUT: ${{ github.event.inputs.out_name || 'CH_routable.img' }}
          JAVA_XMX: 5g
        run: |
          case "$OUT" in *.img) ;; *) OUT="$OUT.img" ;; esac
          OUT="$(basename "$OUT" | tr -c 'A-Za-z0-9_.\n-' '_')"
          args=(--name "$NAME" --family-id "$FID" --out "out/$OUT" --work "$RUNNER_TEMP/work")
          [ -n "$BBOX" ] && args+=(--bbox "$BBOX")
          ./routable/build_img.sh "${args[@]}"
          (cd out && zip -9 "${OUT%.img}.zip" "$OUT")
          ls -la out
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Upload artifact (custom area)
        if: github.event.inputs.bbox != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT }}
          path: out/${{ env.OUT }}
          retention-days: 14

      - name: Publish release (all of Switzerland)
        if: github.event.inputs.bbox == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=routable-latest
          NOTES="Routable vector map of Switzerland for Garmin fenix 9 Pro / Edge 1050.
          OpenStreetMap data as of $(date -u +%F). Map data (c) OpenStreetMap contributors, ODbL.
          Install guide: https://progressive-kiwi.github.io/garminswisstopo-public/app.html#routable"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --title "Routable CH map (latest)" --notes "$NOTES" --latest=false
          fi
          gh release upload "$TAG" "out/$OUT" "out/${OUT%.img}.zip" --clobber
